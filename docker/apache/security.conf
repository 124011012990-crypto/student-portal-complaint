# Apache Security Hardening Configuration

# Disable server signature and tokens
ServerTokens Prod
ServerSignature Off

# Prevent access to sensitive dotfiles (.env, .git, etc.)
<FilesMatch "^\.">
    Require all denied
</FilesMatch>

# Prevent direct access to composer / package metadata
<FilesMatch "(composer\.json|composer\.lock|package\.json|package-lock\.json)">
    Require all denied
</FilesMatch>

# HTTP Security Headers
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set X-XSS-Protection "1; mode=block"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
