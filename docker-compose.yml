version: '3.8'

services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: campuscare_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-bala123}
      MYSQL_DATABASE: ${DB_DATABASE:-campuscare_db}
      MYSQL_USER: ${DB_USER:-campuscare}
      MYSQL_PASSWORD: ${DB_USER_PASSWORD:-campuscare_pass_2026}
    volumes:
      - campuscare_mysql_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "3306:3306"
    networks:
      - campuscare_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PHP 8.2 Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campuscare_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-campuscare_db}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-bala123}
      CORS_ALLOWED_ORIGIN: "*"
    ports:
      - "8000:80"
    volumes:
      - ./backend/storage:/var/www/html/backend/storage
    networks:
      - campuscare_net

  # Lightweight Web Server for Frontend (Nginx)
  frontend:
    image: nginx:alpine
    container_name: campuscare_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - campuscare_net

networks:
  campuscare_net:
    driver: bridge

volumes:
  campuscare_mysql_data:
    driver: local
