<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | CampusCare</title>
  <script>(function(){const t=localStorage.getItem('campuscare_theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/reset.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--color-bg);
      padding: 1.5rem;
      text-align: center;
    }
    .error-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      padding: 3rem 2rem;
      max-width: 500px;
      width: 100%;
      box-shadow: var(--shadow-lg);
    }
    .error-code {
      font-size: 5rem;
      font-weight: 800;
      color: var(--color-primary);
      line-height: 1;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-code">404</div>
    <h1 style="font-size:1.5rem; font-weight:700; margin-bottom:0.75rem; color:var(--color-text-main);">Page Not Found</h1>
    <p style="color:var(--color-text-muted); font-size:0.95rem; line-height:1.6; margin-bottom:2rem;">
      The requested page or complaint document could not be located on the server.
    </p>
    <div style="display:flex; justify-content:center; gap:1rem;">
      <a href="dashboard.html" class="btn btn-primary">Return to Dashboard</a>
      <a href="index.html" class="btn btn-secondary">Homepage</a>
    </div>
  </div>
  <script src="assets/js/theme.js"></script>
</body>
</html>
