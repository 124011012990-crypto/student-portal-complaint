<header class="app-header" id="app-header">
  <!-- Left Side: Mobile Menu Button & Breadcrumbs -->
  <div class="header-left">
    <button id="menu-toggle" class="menu-toggle-btn" aria-label="Toggle navigation drawer" title="Toggle Navigation">
      <span data-icon="menu" data-icon-size="20"></span>
    </button>
    <nav class="breadcrumbs" aria-label="Breadcrumbs">
      <span>Portal</span>
      <span class="breadcrumb-separator">/</span>
      <span class="breadcrumb-current">Dashboard</span>
    </nav>
  </div>

  <!-- Right Side: Dark/Light Mode Switcher, Notifications & Logout -->
  <div class="header-right">
    <button type="button" class="theme-toggle-btn" id="theme-toggle-button" aria-label="Toggle light/dark theme" title="Toggle light/dark theme"></button>
    
    <a href="notifications.html" class="header-action-btn" title="Notifications" aria-label="Notifications">
      <span data-icon="bell" data-icon-size="18"></span>
      <span id="notif-bubble" class="notif-bubble" style="display:none;">0</span>
    </a>
    
    <button type="button" class="btn btn-ghost btn-sm" data-action="logout" title="Sign Out" style="display:inline-flex; align-items:center; gap:6px;">
      <span data-icon="log-out" data-icon-size="16"></span>
      <span>Logout</span>
    </button>
  </div>
</header>
